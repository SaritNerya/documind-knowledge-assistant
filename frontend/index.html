<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- האייקון בלשונית הדפדפן: SVG, חד בכל גודל -->
    <link rel="icon" type="image/svg+xml" href="/documind-book-icon.svg" />
    <!-- מסך הבית באייפון: iOS לא תומך ב-SVG כאן, ולכן נשאר PNG -->
    <link rel="apple-touch-icon" href="/book.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;700&family=Suez+One&display=swap"
    />
    <title>DocuMind</title>
  </head>
  <body>
    <!-- מרקם דיו לחותמת (.stamp בקובץ index.css): רעש עדין שמזיז את הקצוות כדי שלא יהיו חדים -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="ink-rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
